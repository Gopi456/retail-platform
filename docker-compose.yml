services:
  retail-app:
    image: retail-app:${APP_VERSION}
    container_name: retail-app-compose

    ports:
      - "8081:8081"

    environment:
      APP_VERSION: ${APP_VERSION}
      PAYMENT_STATUS: ${PAYMENT_STATUS}
      FAIL_HEALTHCHECK: ${FAIL_HEALTHCHECK:-false}

    networks:
      - retail-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  retail-network:
    name: retail-network
    driver: bridge